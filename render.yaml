services:
  - type: web
    name: assetpulse
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/status
    maxShutdownDelaySeconds: 30
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ASSETPULSE_SESSION_COOKIE_SECURE
        value: "true"
