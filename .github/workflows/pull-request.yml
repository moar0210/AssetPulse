name: Verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend against PostgreSQL
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Test public deployment smoke verifier
        working-directory: .
        run: node --test infra/smoke/public-smoke.test.mjs

  simulator:
    name: Simulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: simulator
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: simulator/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Test public API scenarios
        run: npm test

      - name: Check bounded k6 scenario syntax
        working-directory: .
        shell: bash
        run: node --input-type=module --check < infra/performance/telemetry-to-alert.k6.js

      - name: Test bounded k6 alert evidence
        working-directory: .
        run: node --test infra/performance/alert-evidence.test.mjs infra/performance/origin.test.mjs

      - name: Verify scenario initialization in k6 1.7.1
        working-directory: .
        shell: bash
        run: |
          archive="$RUNNER_TEMP/k6-v1.7.1-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/grafana/k6/releases/download/v1.7.1/k6-v1.7.1-linux-amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 'cc127a656f734f8ea1e89f8a417777905ae6a93d42f3e763e95313518180655b' "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/k6-v1.7.1-linux-amd64/k6" inspect \
            --env ASSETPULSE_BASE_URL=https://example.onrender.com \
            --env ASSETPULSE_K6_PASSWORD=ci-runtime-validation \
            infra/performance/telemetry-to-alert.k6.js

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_ADMIN_PASSWORD: ci-only-admin-password
      SPRING_DATASOURCE_USERNAME: assetpulse
      SPRING_DATASOURCE_PASSWORD: ci-only-app-password
      ASSETPULSE_SESSION_COOKIE_SECURE: true
      ASSETPULSE_HTTP_PORT: 8080
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Verify bootstrap transport and password output boundaries
        run: bash infra/smoke/database-bootstrap.sh

      - name: Build runtime images
        run: docker compose build

      - name: Build database bootstrap image
        run: >-
          docker build
          --file infra/postgres/Dockerfile.bootstrap
          --tag assetpulse-database-bootstrap:local
          infra/postgres

      - name: Build zero-cost hosting image
        run: >-
          docker build
          --file infra/render/Dockerfile
          --build-arg ASSETPULSE_BUILD_REVISION="$GITHUB_SHA"
          --tag assetpulse-web:local
          .

      - name: Scan filesystem dependencies for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          exit-code: "1"
          format: table
          hide-progress: true

      - name: Verify database certificate trust and rejection
        run: bash infra/smoke/database-tls.sh

      - name: Scan repository for detected secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          format: table
          hide-progress: true

      - name: Scan zero-cost hosting image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: assetpulse-web:local
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          exit-code: "1"
          format: table
          hide-progress: true

      - name: Verify non-root runtime users
        shell: bash
        run: |
          test "$(docker image inspect assetpulse-backend:local --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect assetpulse-frontend:local --format '{{.Config.User}}')" = "nginx"
          test "$(docker image inspect assetpulse-database-bootstrap:local --format '{{.Config.User}}')" = "postgres"
          test "$(docker image inspect assetpulse-web:local --format '{{.Config.User}}')" = "10001:10001"

      - name: Verify configurable frontend runtime rendering
        shell: bash
        run: |
          rendered="$(docker run --rm \
            --read-only \
            --tmpfs /tmp \
            --env BACKEND_UPSTREAM=127.0.0.1:8081 \
            --env FRONTEND_PORT=10000 \
            assetpulse-frontend:local \
            nginx -T -c /tmp/nginx.conf 2>&1)"
          grep -F "listen 10000;" <<< "$rendered"
          test "$(grep -c -F "proxy_pass http://127.0.0.1:8081;" <<< "$rendered")" = "2"
          test "$(grep -c -F 'proxy_set_header X-AssetPulse-Client-Address $assetpulse_client_address;' <<< "$rendered")" = "2"
          test "$(grep -c -F 'proxy_set_header X-Forwarded-For $assetpulse_client_address;' <<< "$rendered")" = "2"
          ! grep -F '$proxy_add_x_forwarded_for' <<< "$rendered"
          grep -F "proxy_buffering off;" <<< "$rendered"

      - name: Verify hosting image runtime contract
        shell: bash
        run: |
          test "$(docker image inspect assetpulse-web:local --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          image_environment="$(docker image inspect assetpulse-web:local --format '{{json .Config.Env}}')"
          grep -F -- '-XX:ActiveProcessorCount=1' <<< "$image_environment"
          grep -F -- '-XX:MaxRAMPercentage=55.0' <<< "$image_environment"
          grep -F -- 'SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=4' <<< "$image_environment"
          grep -F -- 'SERVER_TOMCAT_THREADS_MAX=20' <<< "$image_environment"
          grep -F -- 'ASSETPULSE_TELEMETRY_PROCESSING_POLL_DELAY_MILLIS=5000' <<< "$image_environment"
          rendered="$(docker run --rm \
            --entrypoint sh \
            --env FRONTEND_PORT=10000 \
            --env BACKEND_UPSTREAM=127.0.0.1:8081 \
            assetpulse-web:local \
            -c 'envsubst '\''${FRONTEND_PORT} ${BACKEND_UPSTREAM}'\'' < /etc/nginx/templates/nginx.conf.template > /tmp/nginx.conf && nginx -T -c /tmp/nginx.conf 2>&1')"
          grep -F "listen 10000;" <<< "$rendered"
          test "$(grep -c -F "proxy_pass http://127.0.0.1:8081;" <<< "$rendered")" = "2"
          test "$(grep -c -F 'proxy_set_header X-AssetPulse-Client-Address $assetpulse_client_address;' <<< "$rendered")" = "2"
          test "$(grep -c -F 'proxy_set_header X-Forwarded-For $assetpulse_client_address;' <<< "$rendered")" = "2"
          ! grep -F '$proxy_add_x_forwarded_for' <<< "$rendered"
          grep -F "proxy_buffering off;" <<< "$rendered"

      - name: Reject unbounded bootstrap timeout
        shell: bash
        run: |
          if docker run --rm \
            --env PGUSER=postgres \
            --env PGDATABASE=assetpulse \
            --env PGCONNECT_TIMEOUT=00 \
            --env ASSETPULSE_APP_USERNAME=assetpulse \
            --env ASSETPULSE_APP_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            assetpulse-database-bootstrap:local; then
            echo "Bootstrap accepted an unbounded connection timeout" >&2
            exit 1
          fi

      - name: Start isolated application stack
        run: >-
          docker compose
          --project-name assetpulse-ci
          up
          --detach
          --wait
          --wait-timeout 180

      - name: Verify idempotent least-privilege bootstrap
        shell: bash
        run: |
          bootstrap_role() {
            docker run --rm \
              --network assetpulse-ci_database \
              --env PGHOST=postgres \
              --env PGPORT=5432 \
              --env PGDATABASE=assetpulse \
              --env PGUSER=postgres \
              --env PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" \
              --env ASSETPULSE_APP_USERNAME="$SPRING_DATASOURCE_USERNAME" \
              --env ASSETPULSE_APP_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
              assetpulse-database-bootstrap:local
          }

          bootstrap_role
          bootstrap_role

          safe_attributes="$(docker compose \
            --project-name assetpulse-ci \
            exec --no-TTY postgres \
            psql --username=postgres --dbname=assetpulse --tuples-only --no-align \
            --command="SELECT app_role.rolcanlogin AND NOT app_role.rolsuper AND NOT app_role.rolcreatedb AND NOT app_role.rolcreaterole AND NOT app_role.rolinherit AND NOT app_role.rolreplication AND NOT app_role.rolbypassrls AND NOT EXISTS (SELECT 1 FROM pg_auth_members AS membership WHERE membership.member = app_role.oid) FROM pg_roles AS app_role WHERE app_role.rolname = '$SPRING_DATASOURCE_USERNAME';")"
          test "$safe_attributes" = "t"

      - name: Reject administrator role collision
        shell: bash
        run: |
          if docker run --rm \
            --network assetpulse-ci_database \
            --env PGHOST=postgres \
            --env PGPORT=5432 \
            --env PGDATABASE=assetpulse \
            --env PGUSER=postgres \
            --env PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" \
            --env ASSETPULSE_APP_USERNAME=postgres \
            --env ASSETPULSE_APP_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            assetpulse-database-bootstrap:local; then
            echo "Bootstrap accepted the administrator as its application role" >&2
            exit 1
          fi

          admin_is_superuser="$(docker compose \
            --project-name assetpulse-ci \
            exec --no-TTY postgres \
            psql --username=postgres --dbname=assetpulse --tuples-only --no-align \
            --command="SELECT rolsuper FROM pg_roles WHERE rolname = 'postgres';")"
          test "$admin_is_superuser" = "t"

          admin_password_is_valid="$(docker compose \
            --project-name assetpulse-ci \
            exec --no-TTY \
            --env PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" \
            postgres \
            psql --host=127.0.0.1 --username=postgres --dbname=assetpulse --tuples-only --no-align \
            --command="SELECT 1;")"
          test "$admin_password_is_valid" = "1"

      - name: Reject privileged existing application role
        shell: bash
        run: |
          docker compose \
            --project-name assetpulse-ci \
            exec --no-TTY postgres \
            psql --username=postgres --dbname=assetpulse --set=ON_ERROR_STOP=1 \
            --command="CREATE ROLE dangerous_app WITH LOGIN BYPASSRLS PASSWORD 'ci-dangerous-original'; CREATE ROLE limited_admin WITH LOGIN CREATEROLE PASSWORD 'ci-limited-admin'; GRANT dangerous_app TO limited_admin WITH ADMIN OPTION;"

          if docker run --rm \
            --network assetpulse-ci_database \
            --env PGHOST=postgres \
            --env PGPORT=5432 \
            --env PGDATABASE=assetpulse \
            --env PGUSER=limited_admin \
            --env PGPASSWORD=ci-limited-admin \
            --env ASSETPULSE_APP_USERNAME=dangerous_app \
            --env ASSETPULSE_APP_PASSWORD=ci-dangerous-replacement \
            assetpulse-database-bootstrap:local; then
            echo "Bootstrap accepted a privileged existing application role" >&2
            exit 1
          fi

          dangerous_role_is_unchanged="$(docker compose \
            --project-name assetpulse-ci \
            exec --no-TTY postgres \
            psql --username=postgres --dbname=assetpulse --tuples-only --no-align \
            --command="SELECT rolbypassrls FROM pg_roles WHERE rolname = 'dangerous_app';")"
          test "$dangerous_role_is_unchanged" = "t"

          dangerous_password_is_unchanged="$(docker compose \
            --project-name assetpulse-ci \
            exec --no-TTY \
            --env PGPASSWORD=ci-dangerous-original \
            postgres \
            psql --host=127.0.0.1 --username=dangerous_app --dbname=assetpulse --tuples-only --no-align \
            --command="SELECT 1;")"
          test "$dangerous_password_is_unchanged" = "1"

      - name: Reject existing application role membership
        shell: bash
        run: |
          docker compose \
            --project-name assetpulse-ci \
            exec --no-TTY postgres \
            psql --username=postgres --dbname=assetpulse --set=ON_ERROR_STOP=1 \
            --command="CREATE ROLE privileged_group WITH NOLOGIN CREATEDB; CREATE ROLE member_app WITH LOGIN NOINHERIT PASSWORD 'ci-member-original'; GRANT privileged_group TO member_app WITH INHERIT TRUE, SET TRUE;"

          if docker run --rm \
            --network assetpulse-ci_database \
            --env PGHOST=postgres \
            --env PGPORT=5432 \
            --env PGDATABASE=assetpulse \
            --env PGUSER=postgres \
            --env PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" \
            --env ASSETPULSE_APP_USERNAME=member_app \
            --env ASSETPULSE_APP_PASSWORD=ci-member-replacement \
            assetpulse-database-bootstrap:local; then
            echo "Bootstrap accepted an application role with role membership" >&2
            exit 1
          fi

          membership_is_unchanged="$(docker compose \
            --project-name assetpulse-ci \
            exec --no-TTY postgres \
            psql --username=postgres --dbname=assetpulse --tuples-only --no-align \
            --command="SELECT count(*) FROM pg_auth_members AS membership JOIN pg_roles AS member_role ON member_role.oid = membership.member JOIN pg_roles AS granted_role ON granted_role.oid = membership.roleid WHERE member_role.rolname = 'member_app' AND granted_role.rolname = 'privileged_group';")"
          test "$membership_is_unchanged" = "1"

          member_password_is_unchanged="$(docker compose \
            --project-name assetpulse-ci \
            exec --no-TTY \
            --env PGPASSWORD=ci-member-original \
            postgres \
            psql --host=127.0.0.1 --username=member_app --dbname=assetpulse --tuples-only --no-align \
            --command="SELECT 1;")"
          test "$member_password_is_unchanged" = "1"

      - name: Verify local same-origin behavior
        run: node infra/smoke/public-smoke.mjs --base-url http://127.0.0.1:8080 --allow-http

      - name: Install browser journey dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium and its system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify product journeys and accessibility
        working-directory: frontend
        env:
          ASSETPULSE_BASE_URL: http://127.0.0.1:8080
          ASSETPULSE_EXPECT_SECURITY_HEADERS: "true"
        run: npm run test:e2e

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Start zero-cost hosting image
        shell: bash
        run: |
          docker create \
            --name assetpulse-hosting-ci \
            --network assetpulse-ci_database \
            --cpus 0.1 \
            --memory 512m \
            --pids-limit 128 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --publish 127.0.0.1:18080:10000 \
            --env PORT=10000 \
            --env SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/assetpulse \
            --env SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
            --env SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            --env ASSETPULSE_SESSION_COOKIE_SECURE=true \
            --env ASSETPULSE_BUILD_REVISION="$GITHUB_SHA" \
            assetpulse-web:local
          docker network connect assetpulse-ci_edge assetpulse-hosting-ci
          docker start assetpulse-hosting-ci

      - name: Wait for zero-cost hosting image
        shell: bash
        run: |
          # Leave bounded headroom for a cold JVM start under the 0.1-CPU runtime limit.
          for attempt in {1..180}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/status; then
              exit 0
            fi
            sleep 2
          done
          docker logs assetpulse-hosting-ci
          exit 1

      - name: Verify hosted-image same-origin behavior
        run: node infra/smoke/public-smoke.mjs --base-url http://127.0.0.1:18080 --allow-http --request-timeout-ms 30000

      - name: Record bounded runtime fit
        shell: bash
        run: |
          runtime_state="$(docker inspect assetpulse-hosting-ci --format '{{.HostConfig.NanoCpus}}|{{.HostConfig.Memory}}|{{.HostConfig.PidsLimit}}|{{.State.OOMKilled}}|{{.RestartCount}}')"
          test "$runtime_state" = "100000000|536870912|128|false|0"
          docker stats assetpulse-hosting-ci --no-stream --format 'name={{.Name}} cpu={{.CPUPerc}} memory={{.MemUsage}} pids={{.PIDs}}'

      - name: Show application logs after failure
        if: failure()
        shell: bash
        run: |
          docker logs assetpulse-hosting-ci 2>&1 || true
          docker compose --project-name assetpulse-ci logs --no-color

      - name: Remove isolated application stacks
        if: always()
        shell: bash
        run: |
          docker rm --force assetpulse-hosting-ci 2>/dev/null || true
          docker compose --project-name assetpulse-ci down --volumes --remove-orphans
