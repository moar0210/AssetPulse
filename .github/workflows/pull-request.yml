name: Pull request verification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend against PostgreSQL
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build production bundle
        run: npm run build

  simulator:
    name: Simulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: simulator
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: simulator/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Test public API scenarios
        run: npm test

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_ADMIN_PASSWORD: ci-only-admin-password
      SPRING_DATASOURCE_USERNAME: assetpulse
      SPRING_DATASOURCE_PASSWORD: ci-only-app-password
      ASSETPULSE_HTTP_PORT: 8080
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build runtime images
        run: docker compose build

      - name: Verify non-root runtime users
        shell: bash
        run: |
          test "$(docker image inspect assetpulse-backend:local --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect assetpulse-frontend:local --format '{{.Config.User}}')" = "nginx"
