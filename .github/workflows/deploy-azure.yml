name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Pre-created Azure resource group
        required: true
        default: assetpulse-production
        type: string
      location:
        description: Azure region for the deployment
        required: true
        default: swedencentral
        type: string

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  authorize:
    name: Require protected main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject non-main deployments
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

  verify:
    name: Verify deployable commit
    needs: authorize
    uses: ./.github/workflows/pull-request.yml

  deploy:
    name: Provision, deploy, and smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
    env:
      AZURE_RESOURCE_GROUP: ${{ inputs.resource_group }}
      AZURE_LOCATION: ${{ inputs.location }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0

      - name: Validate deployment inputs
        shell: bash
        env:
          AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ secrets.AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          POSTGRES_ADMINISTRATOR_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMINISTRATOR_PASSWORD }}
          APPLICATION_DATABASE_PASSWORD: ${{ secrets.AZURE_APPLICATION_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail

          validate_password() {
            local password="$1"
            local classes=0

            test "${#password}" -ge 12
            test "${#password}" -le 128
            case "$password" in
              *$'\r'*|*$'\n'*) return 1 ;;
            esac

            if [[ "$password" =~ [[:lower:]] ]]; then classes=$((classes + 1)); fi
            if [[ "$password" =~ [[:upper:]] ]]; then classes=$((classes + 1)); fi
            if [[ "$password" =~ [[:digit:]] ]]; then classes=$((classes + 1)); fi
            if [[ "$password" =~ [^[:alnum:]] ]]; then classes=$((classes + 1)); fi
            test "$classes" -ge 3
          }

          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$AZURE_LOCATION"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          validate_password "$POSTGRES_ADMINISTRATOR_PASSWORD"
          validate_password "$APPLICATION_DATABASE_PASSWORD"
          test "$POSTGRES_ADMINISTRATOR_PASSWORD" != "$APPLICATION_DATABASE_PASSWORD"

      - name: Validate Azure template
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Azure prerequisites
        shell: bash
        run: |
          set -euo pipefail
          az group show --name "$AZURE_RESOURCE_GROUP" --output none

          providers=(
            Microsoft.App
            Microsoft.ContainerRegistry
            Microsoft.DBforPostgreSQL
            Microsoft.ManagedIdentity
            Microsoft.Network
            Microsoft.OperationalInsights
          )
          for provider in "${providers[@]}"; do
            registration_state="$(az provider show \
              --namespace "$provider" \
              --query registrationState \
              --output tsv)"
            if [ "$registration_state" != "Registered" ]; then
              echo "$provider must be registered before deployment" >&2
              exit 1
            fi
          done

      - name: Provision Azure foundation
        id: foundation
        shell: bash
        env:
          AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ secrets.AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          POSTGRES_ADMINISTRATOR_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMINISTRATOR_PASSWORD }}
          APPLICATION_DATABASE_PASSWORD: ${{ secrets.AZURE_APPLICATION_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          deployment_name="assetpulse-foundation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          deployment_result="$RUNNER_TEMP/foundation-deployment.json"

          az deployment group create \
            --name "$deployment_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              imageTag="$GITHUB_SHA" \
              deployApplication=false \
              deploymentPrincipalObjectId="$AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" \
              postgresAdministratorPassword="$POSTGRES_ADMINISTRATOR_PASSWORD" \
              applicationDatabasePassword="$APPLICATION_DATABASE_PASSWORD" \
            --output json > "$deployment_result"

          registry_name="$(jq -er '.properties.outputs.containerRegistryName.value' "$deployment_result")"
          registry_server="$(jq -er '.properties.outputs.containerRegistryLoginServer.value' "$deployment_result")"
          echo "registry_name=$registry_name" >> "$GITHUB_OUTPUT"
          echo "registry_server=$registry_server" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure Container Registry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if az acr login --name "${{ steps.foundation.outputs.registry_name }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Check immutable image set
        id: image_preflight
        shell: bash
        env:
          REGISTRY_NAME: ${{ steps.foundation.outputs.registry_name }}
        run: |
          set -euo pipefail
          repositories=(
            assetpulse-backend
            assetpulse-frontend
            assetpulse-database-bootstrap
          )
          existing=0
          repository_list=""
          repository_access=false

          for attempt in {1..30}; do
            if repository_list="$(az acr repository list \
              --name "$REGISTRY_NAME" \
              --output tsv 2>/dev/null)"; then
              repository_access=true
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              break
            fi
            az acr login --name "$REGISTRY_NAME" || true
            sleep 10
          done

          if [ "$repository_access" != "true" ]; then
            echo "ACR repository access did not propagate within five minutes" >&2
            exit 1
          fi

          for repository in "${repositories[@]}"; do
            if grep -Fxq "$repository" <<< "$repository_list"; then
              repository_tags="$(az acr repository show-tags \
                --name "$REGISTRY_NAME" \
                --repository "$repository" \
                --output tsv)"
            else
              repository_tags=""
            fi

            if grep -Fxq "$GITHUB_SHA" <<< "$repository_tags"; then
              metadata="$(az acr repository show \
                --name "$REGISTRY_NAME" \
                --image "$repository:$GITHUB_SHA" \
                --output json)"
              write_enabled="$(jq -r '.changeableAttributes.writeEnabled' <<< "$metadata")"
              delete_enabled="$(jq -r '.changeableAttributes.deleteEnabled' <<< "$metadata")"
              if [ "$write_enabled" != "false" ] || [ "$delete_enabled" != "false" ]; then
                echo "Existing image $repository:$GITHUB_SHA is not immutable" >&2
                exit 1
              fi
              existing=$((existing + 1))
            fi
          done

          if [ "$existing" -eq 0 ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          elif [ "$existing" -eq "${#repositories[@]}" ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "Refusing a partial immutable image set for $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Build immutable runtime images
        if: steps.image_preflight.outputs.reuse != 'true'
        shell: bash
        env:
          REGISTRY_SERVER: ${{ steps.foundation.outputs.registry_server }}
        run: |
          set -euo pipefail
          docker build \
            --file backend/Dockerfile \
            --tag "$REGISTRY_SERVER/assetpulse-backend:$GITHUB_SHA" \
            backend
          docker build \
            --file frontend/Dockerfile \
            --tag "$REGISTRY_SERVER/assetpulse-frontend:$GITHUB_SHA" \
            frontend
          docker build \
            --file infra/postgres/Dockerfile.bootstrap \
            --tag "$REGISTRY_SERVER/assetpulse-database-bootstrap:$GITHUB_SHA" \
            infra/postgres

      - name: Push immutable runtime images
        if: steps.image_preflight.outputs.reuse != 'true'
        shell: bash
        env:
          REGISTRY_NAME: ${{ steps.foundation.outputs.registry_name }}
          REGISTRY_SERVER: ${{ steps.foundation.outputs.registry_server }}
        run: |
          set -euo pipefail

          push_with_retry() {
            local image="$1"
            for attempt in {1..30}; do
              if docker push "$image"; then
                return 0
              fi
              if [ "$attempt" -eq 30 ]; then
                return 1
              fi
              az acr login --name "$REGISTRY_NAME" || true
              sleep 10
            done
          }

          push_with_retry "$REGISTRY_SERVER/assetpulse-backend:$GITHUB_SHA"
          push_with_retry "$REGISTRY_SERVER/assetpulse-frontend:$GITHUB_SHA"
          push_with_retry "$REGISTRY_SERVER/assetpulse-database-bootstrap:$GITHUB_SHA"

      - name: Lock new image tags
        if: steps.image_preflight.outputs.reuse != 'true'
        shell: bash
        env:
          REGISTRY_NAME: ${{ steps.foundation.outputs.registry_name }}
        run: |
          set -euo pipefail
          repositories=(
            assetpulse-backend
            assetpulse-frontend
            assetpulse-database-bootstrap
          )

          for repository in "${repositories[@]}"; do
            az acr repository update \
              --name "$REGISTRY_NAME" \
              --image "$repository:$GITHUB_SHA" \
              --write-enabled false \
              --delete-enabled false \
              --output none
          done

      - name: Resolve immutable image digests
        id: images
        shell: bash
        env:
          REGISTRY_NAME: ${{ steps.foundation.outputs.registry_name }}
        run: |
          set -euo pipefail

          resolve_digest() {
            local repository="$1"
            local metadata
            local digest
            metadata="$(az acr repository show \
              --name "$REGISTRY_NAME" \
              --image "$repository:$GITHUB_SHA" \
              --output json)" || return 1
            test "$(jq -r '.changeableAttributes.writeEnabled' <<< "$metadata")" = "false" || return 1
            test "$(jq -r '.changeableAttributes.deleteEnabled' <<< "$metadata")" = "false" || return 1
            digest="$(jq -er '.digest' <<< "$metadata")" || return 1
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
            printf '%s' "$digest"
          }

          backend_digest="$(resolve_digest assetpulse-backend)"
          frontend_digest="$(resolve_digest assetpulse-frontend)"
          database_bootstrap_digest="$(resolve_digest assetpulse-database-bootstrap)"

          {
            echo "backend_digest=$backend_digest"
            echo "frontend_digest=$frontend_digest"
            echo "database_bootstrap_digest=$database_bootstrap_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy application revision
        id: application
        shell: bash
        env:
          AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ secrets.AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          POSTGRES_ADMINISTRATOR_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMINISTRATOR_PASSWORD }}
          APPLICATION_DATABASE_PASSWORD: ${{ secrets.AZURE_APPLICATION_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          deployment_name="assetpulse-application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          deployment_result="$RUNNER_TEMP/application-deployment.json"
          rollout_suffix="r-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "${#rollout_suffix}" -le 64
          [[ "$rollout_suffix" =~ ^[a-z][a-z0-9]*(-[a-z0-9]+)*$ ]]

          az deployment group create \
            --name "$deployment_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              imageTag="$GITHUB_SHA" \
              deployApplication=true \
              backendImageDigest="${{ steps.images.outputs.backend_digest }}" \
              frontendImageDigest="${{ steps.images.outputs.frontend_digest }}" \
              databaseBootstrapImageDigest="${{ steps.images.outputs.database_bootstrap_digest }}" \
              rolloutSuffix="$rollout_suffix" \
              deploymentPrincipalObjectId="$AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" \
              postgresAdministratorPassword="$POSTGRES_ADMINISTRATOR_PASSWORD" \
              applicationDatabasePassword="$APPLICATION_DATABASE_PASSWORD" \
            --output json > "$deployment_result"

          application_url="$(jq -er '.properties.outputs.applicationUrl.value' "$deployment_result")"
          test "${application_url#https://}" != "$application_url"
          echo "application_url=$application_url" >> "$GITHUB_OUTPUT"

      - name: Verify public HTTPS deployment
        env:
          ASSETPULSE_BASE_URL: ${{ steps.application.outputs.application_url }}
        run: node infra/smoke/public-smoke.mjs

      - name: Record deployment evidence
        shell: bash
        env:
          APPLICATION_URL: ${{ steps.application.outputs.application_url }}
        run: |
          {
            echo "### Azure deployment"
            echo ""
            echo "- URL: $APPLICATION_URL"
            echo "- Image tag: \`$GITHUB_SHA\`"
            echo "- Resource group: \`$AZURE_RESOURCE_GROUP\`"
            echo "- Public HTTPS smoke: passed"
          } >> "$GITHUB_STEP_SUMMARY"
