worker_processes 1;
# Request-scoped Nginx error messages can include client addresses and raw request lines.
# Keep routine request outcomes in the privacy-safe structured access log below.
error_log /dev/stderr crit;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Render places the true public client address first. Keep only that value and
  # replace the forwarding chain before requests enter the loopback trust boundary.
  map $http_x_forwarded_for $assetpulse_client_address {
    ~^\s*(?<assetpulse_first_forwarded_address>[^,\s]+) $assetpulse_first_forwarded_address;
    default $remote_addr;
  }

  log_format assetpulse escape=json
    '{"timestamp":"$time_iso8601",'
    '"method":"$request_method",'
    '"status":$status,'
    '"response_bytes":$body_bytes_sent,'
    '"duration_seconds":$request_time,'
    '"upstream_duration_seconds":"$upstream_response_time",'
    '"correlation_id":"$upstream_http_x_correlation_id"}';

  access_log /dev/stdout assetpulse;

  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen ${FRONTEND_PORT};
    server_name _;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "healthy\n";
    }

    location = /actuator {
      return 404;
    }

    location ^~ /actuator/ {
      return 404;
    }

    location = /openapi.json {
      add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      default_type application/json;
      expires -1;
      try_files $uri =404;
    }

    location = /api/v1/alerts/stream {
      proxy_pass http://${BACKEND_UPSTREAM};
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $assetpulse_client_address;
      proxy_set_header X-AssetPulse-Client-Address $assetpulse_client_address;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 35m;
      proxy_send_timeout 35m;
    }

    location /api/ {
      proxy_pass http://${BACKEND_UPSTREAM};
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $assetpulse_client_address;
      proxy_set_header X-AssetPulse-Client-Address $assetpulse_client_address;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
